# TLS is already terminated on the VPS for ai.iquee.tech.
# Keep the existing ssl_certificate / ssl_certificate_key directives.
# This block only documents the upstream and streaming timeouts.

upstream saas_ai {
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name ai.iquee.tech;

    # ssl_certificate     /etc/letsencrypt/live/ai.iquee.tech/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ai.iquee.tech/privkey.pem;

    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://saas_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # AI SDK streams are long-lived. Buffering would hold the response
        # until the model finishes, so it stays off and the read timeout is long.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
