name: Deploy

# Manual SSH deploy stub. No secrets are stored in the repo.
# Configure GitHub Actions secrets before this can reach a server:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY
# Until those exist the job exits successfully without opening a connection.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "Deploy secrets are not configured."
            echo "Set VPS_HOST, VPS_USER, and VPS_SSH_KEY (and optional VPS_PATH) in GitHub Actions."
            echo "Skipping remote connection."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          DEST="${VPS_PATH:-/opt/saas-ai}"
          ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" "cd '$DEST' && git pull && docker compose -f docker-compose.prod.yml up -d --build"
